<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus News</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #333; /* Perbaikan 1: 'colour' -> 'color' */
    }
    header {
      background: #dbe7f3; /* Perbaikan 2: Titik koma ditambahkan */
      padding: 20px;
    }
    .card { /* Perbaikan 3: '.Card' -> '.card' disesuaikan dengan HTML */
      border: 1px solid #ccc;
      padding: 16px;
    }
    #newsList { /* Perbaikan 9: '#news-list' -> '#newsList' disesuaikan dengan ID HTML */
      font-size: 18px; /* Perbaikan 4: '18 px' -> '18px' */
    }
    footer {
      text-align: center; /* Perbaikan 5: 'centre' -> 'center' */
    }
  </style>
</head>
<body>
  <header>
    <h1>Campus News</h1> <!-- Perbaikan 6: Penutup '</h2>' diganti '</h1>' -->
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a> <!-- Perbaikan 7: Tanda petik penutup ditambahkan -->
    </nav>
  </header>
  <main>
    <section class="card">
      <img src="https://placehold.co/600x200?text=News" alt="Campus News Banner"> <!-- Perbaikan 8: Atribut alt ditambahkan -->
      <ul id="newsList">
        <li>New library books have arrived</li>
        <li>Coding Day registration is open</li>
      </ul>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 STT Cipasung</p>
  </footer>
</body>
</html>
