<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT Cipasung - Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333333;
    }
    
    header {
      background-color: #003366;
      color: white;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 15px;
    }

    nav a {
      color: #cccccc;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }

    section {
      margin-bottom: 30px;
    }

    h2 {
      font-size: 24px;
      color: #003366;
    }

    img {
      max-width: 100%;
      height: auto;
      margin-top: 15px;
    }

    form p {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="email"] {
      padding: 8px;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    button {
      padding: 8px 16px;
      background-color: #003366;
      color: white;
      border: none;
      cursor: pointer;
    }

    footer {
      background-color: #f4f4f4;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>STT Cipasung</h1>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#programs">Programs</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>About Us</h2>
      <p>STT Cipasung is a technology college in Tasikmalaya.</p>
      <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="STT Cipasung Campus Image">
    </section>

    <section id="contact">
      <h2>Contact Us</h2>
      <form action="#" method="post">
        <p>
          <label for="review-name">Name:</label>
          <input type="text" id="review-name" name="name" placeholder="Name" required>
        </p>
        <p>
          <label for="review-email">Email:</label>
          <input type="email" id="review-email" name="email" placeholder="Email" required>
        </p>
        <p>
          <button type="submit">Send</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; Nisa Asiah 2026 STT Cipasung</p>
  </footer>

</body>
</html>
