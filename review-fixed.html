<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STT Cipasung</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      color: #333333;
      line-height: 1.6;
    }
    header {
      background-color: #003366;
      color: white;
      padding: 20px;
    }
    header h1 {
      margin: 0;
      color: white;
    }
    nav ul {
      display: flex;
      gap: 15px;
      list-style: none;
      padding: 0;
    }
    nav a {
      color: #cccccc;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      padding: 20px;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
    }
    footer {
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>STT Cipasung</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Programs</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>About Us</h2>
      <p>STT Cipasung is a technology college in Tasikmalaya.</p>
      <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="STT Cipasung Campus">
    </section>

    <section>
      <h2>Contact Us</h2>
      <form action="#" method="post">
        <div class="form-group">
          <label for="rev-name">Name</label>
          <input type="text" id="rev-name" placeholder="Name">
        </div>
        <div class="form-group">
          <label for="rev-email">Email</label>
          <input type="email" id="rev-email" placeholder="Email">
        </div>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Copyright 2026</p>
  </footer>

</body>
</html>
